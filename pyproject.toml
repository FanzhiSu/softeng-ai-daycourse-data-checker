[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-data-checker"
version = "0.1.0"
description = "Teaching project for research software engineering"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
